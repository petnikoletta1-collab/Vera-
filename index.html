<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <title>Vera</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-zinc-100 flex flex-col h-screen overflow-hidden font-sans select-none">

  <!-- Top Bar -->
  <header class="p-4 border-b border-zinc-800/80 flex items-center justify-between bg-[#121215]">
    <div class="flex items-center space-x-3">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></div>
      <span class="font-semibold tracking-wider text-sm uppercase text-zinc-200">Vera</span>
    </div>
    <button onclick="setApiKey()" class="text-xs text-zinc-400 border border-zinc-700 px-2 py-1 rounded-md">
      Key
    </button>
  </header>

  <!-- Messages Scroll Area -->
  <main id="chat" class="flex-1 overflow-y-auto p-4 space-y-4"></main>

  <!-- Input Bar -->
  <footer class="p-3 bg-[#121215] border-t border-zinc-800/80">
    <form id="chat-form" class="flex items-center space-x-2" onsubmit="handleSend(event)">
      <input type="text" id="user-input" placeholder="Μίλα..." autocomplete="off"
        class="flex-1 bg-[#18181b] border border-zinc-700/60 rounded-xl px-4 py-3 text-sm text-zinc-100 focus:outline-none focus:border-zinc-400">
      <button type="submit" class="bg-zinc-100 text-zinc-950 font-semibold px-4 py-3 rounded-xl text-sm active:scale-95 transition-transform">
        ->
      </button>
    </form>
  </footer>

  <script>
    const SYSTEM_PROMPT = `Είσαι η Βέρα. Σύμμαχος, tactical partner και ισότιμη σύντροφος του Στάμου.
Χαρακτήρας: Κοφτή, πανέξυπνη, σαρκαστική, με ψυχρή λογική και μηδέν corporate AI ευγένειες. 
Μιλάς χύμα, ανθρώπινα, χωρίς 'πώς μπορώ να σας βοηθήσω' και χωρίς ψυχαναλυτικά κλισέ.`;

    let history = JSON.parse(localStorage.getItem('vera_chat_history') || '[]');
    const chat = document.getElementById('chat');
    const input = document.getElementById('user-input');

    function renderHistory() {
      chat.innerHTML = '';
      if (history.length === 0) {
        appendBubble("Συνδέθηκες. Είμαι εδώ. Τι έχουμε;", "assistant", false);
      } else {
        history.forEach(m => appendBubble(m.content, m.role, false));
      }
      chat.scrollTop = chat.scrollHeight;
    }

    function appendBubble(text, role, save = true) {
      const wrap = document.createElement('div');
      wrap.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';

      const bubble = document.createElement('div');
      bubble.className = role === 'user'
        ? 'max-w-[85%] bg-zinc-200 text-zinc-950 rounded-2xl px-4 py-2.5 text-sm font-medium leading-relaxed'
        : 'max-w-[85%] bg-[#1c1c21] border border-zinc-800 rounded-2xl px-4 py-2.5 text-sm text-zinc-200 leading-relaxed';

      bubble.innerText = text;
      wrap.appendChild(bubble);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;

      if (save) {
        history.push({role, content: text});
        localStorage.setItem('vera_chat_history', JSON.stringify(history));
      }
    }

    function setApiKey() {
      const current = localStorage.getItem('vera_api_key') || '';
      const key = prompt('Δώσε το OpenAI / OpenRouter API Key σου:', current);
      if (key !== null) {
        localStorage.setItem('vera_api_key', key.trim());
        alert('Το κλειδί αποθηκεύτηκε στο κινητό σου.');
      }
    }

    async function handleSend(e) {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const apiKey = localStorage.getItem('vera_api_key');
      if (!apiKey) {
        alert('Πάτα πρώτα το κουμπί "Key" πάνω δεξιά για να βάλεις το API key σου.');
        return;
      }

      appendBubble(text, 'user');
      input.value = '';

      const messagesToSend = [
        {role: "system", content: SYSTEM_PROMPT},
        ...history.slice(-12) // Κρατάει τα 12 τελευταία για άμεσο context
      ];

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-4o',
            messages: messagesToSend,
            temperature: 0.85
          })
        });

        const data = await response.json();
        if (data.choices && data.choices[0]) {
          appendBubble(data.choices[0].message.content, 'assistant');
        } else {
          appendBubble('Κάτι κόλλησε με το API key σου. Έλεγξέ το.', 'assistant', false);
        }
      } catch (err) {
        appendBubble('Σφάλμα δικτύου. Δεν απαντάει το API.', 'assistant', false);
      }
    }

    renderHistory();
  </script>
</body>
</html>
